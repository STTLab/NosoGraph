# SPDX-License-Identifier: MPL-2.0
#
# LOOSE conda spec — best-effort fallback for `-profile micromamba`/conda runs.
# The reproducible distribution is the container image built from this file
# (ghcr.io/minaminii/bioinf-blast, pinned by digest); see containers/README.md.
#
# Single source of truth: the assembly-qc-iden module symlinks this file. Edit it
# here; the subtree-split pipeline materializes a real copy for vendored modules.
name: assembly-qc-iden-blast
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # BLAST+ pinned per the SOW (§6). BLAST+ uses runtime CPU-feature dispatch (it probes
  # for SSE/AVX at startup and falls back), so 2.16.0 runs on the Xeon E5-2670 v0 (no
  # AVX2) test server without illegal-instruction faults. Pin to an earlier build if a
  # future release ever SIGILLs there (same policy as the other vendored conda envs).
  - blast=2.16.0
