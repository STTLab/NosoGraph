# SPDX-License-Identifier: MPL-2.0
#
# LOOSE conda spec — best-effort fallback for `-profile micromamba`/conda runs.
# The reproducible distribution is the container image built from this file
# (ghcr.io/minaminii/bioinf-autocycler, pinned by digest); see containers/README.md.
#
# Single source of truth: the autocycler module symlinks this file. Edit it here;
# the subtree-split pipeline materializes a real copy for vendored modules.
name: autocycler
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- AVX2 pins -------------------------------------------------------------
  # Several bioconda builds assume a modern CPU and emit AVX2 instructions, which
  # crash (SIGILL / "Illegal instruction") on older hardware lacking AVX2 (e.g. the
  # Intel Xeon E5-2670 v0 test server). Pins below are the newest builds that run
  # without AVX2 — safe to relax/remove on AVX2-capable machines.
  - python=3.12            # newer Python pulls deps that assume AVX2; 3.12 is stable here
  - flye=2.9.5             # later Flye builds crash without AVX2
  - racon=1.4.20           # racon 1.5.0 requires AVX2; minipolish drives racon (miniasm helper)
  # ---------------------------------------------------------------------------
  - autocycler
  # Default assemblers used by `autocycler helper` (params.assemblers).
  # Extend this list to match any assemblers you add (canu, necat,
  # nextdenovo, metamdbg, plassembler, ...).
  - miniasm
  - raven-assembler
  - minipolish
  - any2fasta
  - minimap2
  - canu
  - plassembler
