# SPDX-License-Identifier: MPL-2.0
#
# LOOSE conda spec — best-effort fallback for `-profile micromamba`/conda runs.
# The reproducible distribution is the container image built from this file
# (ghcr.io/minaminii/bioinf-bacterial-assembly, pinned by digest); see
# containers/README.md. Only the AVX2-critical *versions* are pinned here — that
# is what guarantees an AVX2-safe solve; build strings are intentionally loose.
#
# Single source of truth: the modules symlink this file (e.g.
# nextflow/modules/bacterial-assembly/conda/bacterial-assembly.yaml -> here). Edit
# it here; the subtree-split pipeline materializes real copies for vendored modules.
name: bacterial-assembly
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- AVX2-safe pins --------------------------------------------------------
  # The Intel Xeon E5-2670 v0 test server lacks AVX2; newer bioconda builds emit
  # AVX2 and abort with "Illegal instruction" (SIGILL). These are the newest
  # builds that run without AVX2. flye 2.9.5 / racon 1.4.20 only have py3.8/3.9
  # builds, which is why python is pinned to 3.9 here (and why CheckM2 — needing
  # newer python + zlib — lives in its own env, envs/checkm2.yaml). Relax on
  # AVX2-capable hardware.
  - python=3.9
  - flye=2.9.5
  - racon=1.4.20
  # ---------------------------------------------------------------------------
  # Assembly
  - canu
  # Long-read polishing (racon)
  - minimap2
  # Short-read polishing (pilon)
  - bwa-mem2
  - samtools
  - pilon
