services:
  neo4j:
    image: neo4j:2026.04.0-community-trixie
    container_name: nosograph_neo4j

    restart: unless-stopped

    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"

    volumes:
      - neo4j-data:/data

    environment:
      # Authentication
      - NEO4J_AUTH=${NEO4J_AUTH:-none}

      # Allow file import/export
      - NEO4J_server_directories_import=/import

      # Optional: APOC support
      # - NEO4JLABS_PLUGINS=["apoc"]
      # - NEO4J_dbms_security_procedures_unrestricted=apoc.*

      # Optional: configure memory
      # - NEO4J_server_memory_heap_initial__size=1G
      # - NEO4J_server_memory_heap_max__size=1G

volumes:
  neo4j-data:
