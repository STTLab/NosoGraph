name: bacterial-assembly
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Versions match the proven NosoGraph lockfile; this combined env solves on
  # python 3.12 (flye 2.9.5 / racon 1.4.20 do not have py312 builds and will not
  # co-solve here).
  #
  # AVX2 note: the Xeon E5-2670 v0 test server lacks AVX2. If flye/racon abort with
  # "Illegal instruction" (SIGILL) at runtime, downgrade those tools to AVX2-safe
  # builds (which forces python 3.9) and split CheckM2 into its own env.
  - python=3.12
  - flye=2.9.6
  - racon=1.5.0
  # Assembly
  - canu
  # Long-read polishing (racon)
  - minimap2
  # Short-read polishing (pilon)
  - bwa-mem2
  - samtools
  - pilon
  # QC
  - checkm2
