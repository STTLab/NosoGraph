# SPDX-License-Identifier: MPL-2.0
#
# LOOSE conda spec — best-effort fallback for `-profile micromamba`/conda runs.
# The reproducible distribution is the container image built from this file
# (ghcr.io/minaminii/bioinf-kraken2, pinned by digest); see containers/README.md.
#
# Single source of truth: the kraken2-classify module symlinks this file. Edit it
# here; the subtree-split pipeline materializes a real copy for vendored modules.
name: kraken2
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # kraken2 has no AVX2 requirement, so it runs on the older Xeon E5-2670 v0 test
  # server. If a future build ever SIGILLs there, pin to an AVX2-safe build (same
  # policy as the other vendored conda envs).
  - python=3.12
  - kraken2=2.1.3
  - libgcc-ng
  - libgomp
