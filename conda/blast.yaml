# LOCKED ENV — fully pinned (name=version=build) for daily reproducibility.
# Generated 2026-07-03 from a fresh verified resolve: BLAST+ 2.16.0.
# Smoke-tested (blastn -version -> 2.16.0+, runs AVX2-free via runtime dispatch).
#
# Channels are conda-forge + bioconda only (NO defaults). With defaults in the
# list the solver picked defaults' _openmp_mutex but conda-forge's libgcc-ng,
# and pulled NO libgomp package -> blastn failed with
# "libgomp.so.1: cannot open shared object file". Dropping defaults pulls
# conda-forge libgomp and fixes it — same policy as conda/blast.yaml.
